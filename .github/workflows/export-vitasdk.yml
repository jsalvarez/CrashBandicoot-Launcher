name: Export VitaSDK Toolchain

on:
  workflow_dispatch:
  push:
    branches: [vita-bootstrap]
    paths:
      - ".github/workflows/export-vitasdk.yml"

jobs:
  export:
    runs-on: ubuntu-latest
    container:
      image: vitasdk/vitasdk:2026.08

    steps:
      - name: Package GCC internals only
        shell: bash
        run: |
          set -euxo pipefail
          find "$VITASDK/lib/gcc" -name cc1plus -o -name cc1
          tar -C "$VITASDK" -czf /tmp/vitasdk-gcc-internals.tar.gz lib/gcc
          ls -lh /tmp/vitasdk-gcc-internals.tar.gz

      - name: Upload compiler internals
        uses: actions/upload-artifact@v4
        with:
          name: VitaSDK-GCC-Internals-2026.08
          path: /tmp/vitasdk-gcc-internals.tar.gz
          compression-level: 0
          retention-days: 1
